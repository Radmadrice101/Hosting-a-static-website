version: 1
env:
  - name: NODE_ENV
    value: production
backend:
  phases:
    build:
      commands:
        - npm ci
        - npx ampx generate outputs --branch $AWS_BRANCH
frontend:
  phases:
    preBuild:
      commands:
        - echo "Deploying static website to Amplify..."
    build:
      commands:
        - echo "Static website ready"
  artifacts:
    baseDirectory: .
    files:
      - index.html
  excludedFiles:
    - node_modules/**/*
    - amplify/**/*
    - package.json
    - package-lock.json
    - .git/**/*
    - .gitignore
    - README.md
